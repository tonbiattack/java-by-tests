name: Verify examples and build site
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run JUnit examples
        run: mvn -B -f examples/pom.xml test
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Enable pnpm
        run: corepack enable
      - name: Install site dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Astro site
        run: pnpm build
